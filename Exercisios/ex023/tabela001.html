<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        table {
            width: 400px;
            border-collapse: collapse; /*juntos sem espaco entre linhas*/
            height: 400px;
        }
        td {
            border: 1px solid black;
            padding: 6px;
            text-align: center; /*Alinhamento horizontal: left - center - rigth */
            vertical-align: middle; /* Alinhamento Vertical: top - middel - bottom*/
        }
    </style>
</head>
<body>
    <h1>Minha primeira tabela</h1>
    <!--
     HIERARQUIA DE TABELAS (simples)
     TABLE = tabela
        TABLE ROW = linha de tabela
            TABLE HEADER = cabeçalho de tabela
            TABLE DATA = dado de tabela 
    -->
    <table>
        <!-- Nao é obrigatorio fechar </> -->
        <tr>
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
        <tr>
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
        </tr>
        <tr>
            <td>A3</td>
            <td>B3</td>
            <td>C3</td>
        </tr>
        <tr>
            <td>A4</td>
            <td>B4</td>
            <td>C4</td>
        </tr>
    </table>
</body>
</html>
