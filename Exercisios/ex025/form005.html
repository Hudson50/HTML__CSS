<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de Formulario</h1>
    <form action="" method="gat" autocomplete="on">
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" id="isxmas" value="M"><label for="isxmas">Masculino</label></br>
            <input type="radio" name="sexo" id="isxfen" value="F"><label for="isxfen">Femenino</label>
        </fieldset>
        <fieldset>
            <legend>Esportes Favoridos</legend>
            <input type="checkbox" name="fut" id="ifut"> <label for="ifut">Futebol</label></br>
            <input type="checkbox" name="basq" id="ibasq"><label for="ibasq">Basquete</label></br>
            <input type="checkbox" name="nat" id="inat"><label for="inat">Natação</label></br>
            <input type="checkbox" name="ten" id="iten"><label for="iten">Tênis</label></br>
        </fieldset>
        
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
